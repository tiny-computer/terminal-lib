plugins {
    id 'com.android.library' version '8.7.3'
    id 'maven-publish'
}

android {
    namespace 'com.offsec.terminal.lib'

    compileSdk 36

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 36

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    compileOptions {
        targetCompatibility 17
        sourceCompatibility 17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Publication metadata configured eagerly (required by Gradle 8.x)
// Component attachment deferred until Android plugin creates components
publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.tiny-computer'
            artifactId = 'terminal-lib'
            version = '1.0.0'
        }
    }
}

afterEvaluate {
    publishing.publications.release.from(components.release)
}
